<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#bd7b43"><title>Corcho — Pega tus ideas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito+Sans:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><main class="app-shell"><aside class="sidebar" aria-label="Tableros"><div class="brand"><span class="brand-pin">●</span><span>corcho</span></div><button class="new-board" id="newBoard"><span>＋</span> Nuevo tablero</button><nav id="boards" class="boards"></nav><div class="sidebar-bottom"><button class="side-action" id="themeToggle"><span>◐</span> Modo oscuro</button><button class="side-action"><span>⚙</span> Ajustes</button><div class="profile"><div class="avatar">A</div><div><strong>Antonio</strong><small>Sincronización local</small></div></div></div></aside><section class="workspace"><header class="topbar"><div class="board-title"><span id="boardEmoji">🏠</span><h1 id="boardName">Personal</h1><span class="note-count" id="noteCount"></span></div><div class="tools"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar en el corcho"></label><button class="round-button" id="soundToggle" title="Activar sonidos">♬</button><button class="add-button" id="addNote">＋ <span>Nueva idea</span></button></div></header><div class="hint" id="hint"><span>✦</span> Toca un espacio vacío para pegar una idea</div><section class="corkboard" id="corkboard" aria-label="Tablero de ideas"></section><div class="trash-zone" id="trash"><span>⌫</span><small>Soltar para eliminar</small></div></section></main><dialog id="noteDialog"><form method="dialog" class="note-editor" id="noteForm"><div class="editor-top"><span id="editorLabel">Nueva idea</span><button value="cancel" class="close">×</button></div><textarea id="noteText" placeholder="¿Qué está pasando por tu cabeza?"></textarea><div class="editor-bottom"><div class="color-picker" id="colorPicker"></div><div class="editor-actions"><button type="button" class="delete-text" id="deleteNote">Eliminar</button><button value="save" class="pin-button">📌 Pegar en el corcho</button></div></div></form></dialog><div class="toast" id="toast" role="status"></div><script src="app.js"></script></body></html>
